<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangladeshi Carrom Board Game</title>
    <style>
        body {
            background-color: #2c1d11;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 10px;
            color: #f39c12;
            text-shadow: 2px 2px 4px #000;
        }

        p {
            margin-top: 0;
            color: #bdc3c7;
        }

        /* ক্যারম বোর্ডের বাইরের ফ্রেম */
        #board-container {
            position: relative;
            width: 500px;
            height: 500px;
            background: #d2b48c; /* ক্যারম বোর্ডের মূল রঙ */
            border: 20px solid #5c3a21; /* কাঠের বর্ডার */
            border-radius: 12px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.8);
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <h1>🎮 আসল বাংলা ক্যারম বোর্ড</h1>
    <p>স্ট্রাইকার ক্লিক করে টেনে ধরে ছেড়ে দাও (Drag & Release to Shoot)</p>

    <div id="board-container">
        <canvas id="carromCanvas" width="500" height="500"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('carromCanvas');
        const ctx = canvas.getContext('2d');

        const BOARD_SIZE = 500;
        const POCKET_RADIUS = 22;
        const GUTI_RADIUS = 12;
        const STRIKER_RADIUS = 16;

        let gutis = [];
        let striker = { x: 250, y: 410, vx: 0, vy: 0, isDragging: false };
        let dragStart = { x: 0, y: 0 };

        // ৪টি পকেটের পজিশন
        const pockets = [
            { x: 35, y: 35 },
            { x: BOARD_SIZE - 35, y: 35 },
            { x: 35, y: BOARD_SIZE - 35 },
            { x: BOARD_SIZE - 35, y: BOARD_SIZE - 35 }
        ];

        // গুটি সাজানোর ফাংশন (৯ সাদা, ৯ কালো, ১ লাল)
        function initGutis() {
            gutis = [];
            const centerX = BOARD_SIZE / 2;
            const centerY = BOARD_SIZE / 2;

            // ১টি রেড (রানী) ঠিক মাঝখানে
            gutis.push({ x: centerX, y: centerY, vx: 0, vy: 0, color: '#e74c3c', stroke: '#900C3F', type: 'red' });

            // প্রথম রিং (Inner Circle - 6 gutis: alternate White & Black)
            const r1 = GUTI_RADIUS * 2.1;
            for (let i = 0; i < 6; i++) {
                let angle = (i * 60) * Math.PI / 180;
                let isWhite = i % 2 === 0;
                gutis.push({
                    x: centerX + r1 * Math.cos(angle),
                    y: centerY + r1 * Math.sin(angle),
                    vx: 0, vy: 0,
                    color: isWhite ? '#ffffff' : '#2c3e50',
                    stroke: isWhite ? '#ccc' : '#000',
                    type: isWhite ? 'white' : 'black'
                });
            }

            // দ্বিতীয় রিং (Outer Circle - 12 gutis)
            const r2 = GUTI_RADIUS * 4.1;
            for (let i = 0; i < 12; i++) {
                let angle = (i * 30 + 15) * Math.PI / 180;
                let isWhite = i % 2 !== 0; // Balance to make total 9 White & 9 Black
                gutis.push({
                    x: centerX + r2 * Math.cos(angle),
                    y: centerY + r2 * Math.sin(angle),
                    vx: 0, vy: 0,
                    color: isWhite ? '#ffffff' : '#2c3e50',
                    stroke: isWhite ? '#ccc' : '#000',
                    type: isWhite ? 'white' : 'black'
                });
            }
        }

        // বোর্ড ও এরিয়া ড্র করা
        function drawBoard() {
            // ব্যাকগ্রাউন্ড
            ctx.fillStyle = '#f3e5ab';
            ctx.fillRect(0, 0, BOARD_SIZE, BOARD_SIZE);

            // ৪টি পকেট (Pocket)
            ctx.fillStyle = '#1a1a1a';
            pockets.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, POCKET_RADIUS, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#5c3a21';
                ctx.lineWidth = 3;
                ctx.stroke();
            });

            // সেন্টার সার্কেল (Center Circle)
            ctx.beginPath();
            ctx.arc(BOARD_SIZE / 2, BOARD_SIZE / 2, 45, 0, Math.PI * 2);
            ctx.strokeStyle = '#c0392b';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(BOARD_SIZE / 2, BOARD_SIZE / 2, 15, 0, Math.PI * 2);
            ctx.fillStyle = '#e74c3c';
            ctx.fill();

            // বেস লাইন (Base Lines for Striker)
            drawBaseLine(100, 410, 400, 410); // Bottom
            drawBaseLine(100, 90, 400, 90);   // Top
            drawBaseLine(90, 100, 90, 400);   // Left
            drawBaseLine(410, 100, 410, 400); // Right
        }

        function drawBaseLine(x1, y1, x2, y2) {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = '#c0392b';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // গুটি ও স্ট্রাইকার আঁকা
        function drawCircles() {
            // গুটি আঁকা
            gutis.forEach(g => {
                ctx.beginPath();
                ctx.arc(g.x, g.y, GUTI_RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = g.color;
                ctx.fill();
                ctx.strokeStyle = g.stroke;
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // স্ট্রাইকার আঁকা
            ctx.beginPath();
            ctx.arc(striker.x, striker.y, STRIKER_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = '#f1c40f'; // গোল্ডেন/হলুদ স্ট্রাইকার
            ctx.fill();
            ctx.strokeStyle = '#d35400';
            ctx.lineWidth = 3;
            ctx.stroke();

            // শট মারার নির্দেশক লাইন
            if (striker.isDragging) {
                ctx.beginPath();
                ctx.moveTo(striker.x, striker.y);
                ctx.lineTo(striker.x + (dragStart.x - striker.x), striker.y + (dragStart.y - striker.y));
                ctx.strokeStyle = 'rgba(231, 76, 60, 0.8)';
                ctx.lineWidth = 3;
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        // ফিজিক্স এবং পজিশন আপডেট
        function updatePhysics() {
            const allItems = [...gutis, striker];

            allItems.forEach(item => {
                item.x += item.vx;
                item.y += item.vy;

                // ফ্রিকশন/ঘর্ষণ (ধীরে ধীরে থামা)
                item.vx *= 0.98;
                item.vy *= 0.98;

                if (Math.abs(item.vx) < 0.05) item.vx = 0;
                if (Math.abs(item.vy) < 0.05) item.vy = 0;

                // বোর্ডের দেয়াল/বর্ডারে ধাক্কা
                if (item.x - GUTI_RADIUS < 15 || item.x + GUTI_RADIUS > BOARD_SIZE - 15) item.vx *= -1;
                if (item.y - GUTI_RADIUS < 15 || item.y + GUTI_RADIUS > BOARD_SIZE - 15) item.vy *= -1;

                // পকেটে গুটি পড়া চেক করা
                pockets.forEach(p => {
                    let dist = Math.hypot(p.x - item.x, p.y - item.y);
                    if (dist < POCKET_RADIUS) {
                        if (item === striker) {
                            // স্ট্রাইকার পকেটে পড়লে রিকভারি
                            striker.x = 250;
                            striker.y = 410;
                            striker.vx = 0;
                            striker.vy = 0;
                        } else {
                            // গুটি পকেটে পড়লে বোর্ড থেকে গায়েব
                            gutis = gutis.filter(g => g !== item);
                        }
                    }
                });
            });

            // গুটি ও স্ট্রাইকারের একে অপরের সাথে ধাক্কা (Collision)
            for (let i = 0; i < allItems.length; i++) {
                for (let j = i + 1; j < allItems.length; j++) {
                    let a = allItems[i];
                    let b = allItems[j];
                    let dx = b.x - a.x;
                    let dy = b.y - a.y;
                    let dist = Math.hypot(dx, dy);
                    let minDist = (a === striker || b === striker) ? GUTI_RADIUS + STRIKER_RADIUS : GUTI_RADIUS * 2;

                    if (dist < minDist) {
                        let angle = Math.atan2(dy, dx);
                        let targetX = a.x + Math.cos(angle) * minDist;
                        let targetY = a.y + Math.sin(angle) * minDist;
                        let ax = (targetX - b.x) * 0.1;
                        let ay = (targetY - b.y) * 0.1;

                        a.vx -= ax;
                        a.vy -= ay;
                        b.vx += ax;
                        b.vy += ay;
                    }
                }
            }
        }

        // মাউস কন্ট্রোল (Drag & Shoot)
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            let dist = Math.hypot(mouseX - striker.x, mouseY - striker.y);
            if (dist < STRIKER_RADIUS + 10) {
                striker.isDragging = true;
                dragStart = { x: mouseX, y: mouseY };
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (striker.isDragging) {
                const rect = canvas.getBoundingClientRect();
                dragStart.x = e.clientX - rect.left;
                dragStart.y = e.clientY - rect.top;
            }
        });

        canvas.addEventListener('mouseup', () => {
            if (striker.isDragging) {
                striker.vx = (striker.x - dragStart.x) * 0.15;
                striker.vy = (striker.y - dragStart.y) * 0.15;
                striker.isDragging = false;
            }
        });

        // গেম লুপ
        function gameLoop() {
            ctx.clearRect(0, 0, BOARD_SIZE, BOARD_SIZE);
            drawBoard();
            updatePhysics();
            drawCircles();
            requestAnimationFrame(gameLoop);
        }

        initGutis();
        gameLoop();
    </script>
</body>
</html>
